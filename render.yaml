# render.yaml
services:
  - type: web
    name: mother-api
    env: docker
    region: ohio
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Set securely in Render dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_API_SECRET
        sync: false
